source:
  document: PARI Standard High Carbon  Alloy Steel Material Selection PRD-GD-DES-11.pdf
  document_id: PRD/GD/DES/11
  version: 1
  revision: 1
  effective_date: '2016-03-09'
  section: Material, Heat Treatment Type and Hardness range
  pdf_pages:
  - 1
  repository_path: data/client_set/WP Specific Guidelines/PARI Standard High Carbon  Alloy
    Steel Material Selection PRD-GD-DES-11.pdf
  sha256: 282c05fcfdf5a4481e2778a13458029a6f3e3c2d4da53532fd195e80a4f54157
scope: Complete page-1 transcription, all 13 rows and all six process columns. Printed
  NIL is retained. Unknown materials/processes are not automatically prohibited; note
  iii permits justified exceptions.
general_notes:
  i: Raw material given in the below table to be selected & specified on drawing by
    Designer based on it's Heat Treatment Properties and application requirement.
  ii: Requirements of Forging / Magnetic Particle testing / Ultrasonic testing / Dye
    Penetrant testing / Stress Relieving to be specified by Designer on drawing as
    per application requirement.
  iii: Any raw material apart from below table can be selected by Designer for the
    specific reason of special requirements and specify such raw material with Heat
    treatment requirements & NDT requirements as applicable on drawing.
column_notes:
  flame: Area to be hardened to be shown by XXXXX on drawing.
  induction: Area to be hardened to be shown by XXXXX on drawing.
  case: Area to be hardened to be shown by XXXXX on drawing.
  case_depth_header: The case-hardening column header repeats HRC for depth, but its
    cells explicitly give depth in mm. Cell units are retained; the header typo is
    not used as a depth unit.
  mechanical_property_units: UTS and allowable stress are labelled Kg/mm² in the source.
    No automatic conversion to MPa or reinterpretation as kgf/mm² is made.
  merged_raw_material_note: The raw-material note Consult Purchase for complex or
    large shapes & sizes is a merged cell spanning rows 8–13.

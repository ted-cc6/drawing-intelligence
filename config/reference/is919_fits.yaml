# [upper, lower], one pair per size step (over, up to and including). Used by WST-207 (fit deviations match)
# and TL-013 (fit code valid).
#
# Each value was read from the scan and cross-checked against ISO 286-2; they agree everywhere except one
# misprint, corrected here: j6 over 80 to 120, upper, printed "+1" (ISO 286-2 and the j-row pattern: +13).
# Not transcribed: zones whose values change within a size step (r6, s6, t7, u7, c9, a11, R7, S7, C9, A11, C11);
# none was seen on the 200-drawing development sample. A zone not in this table gets no finding.

  document: India Raw material sizes 08-Feb-24.xlsx
  section: All nonempty worksheet cells and merged-range metadata in all 16 worksheets;
    original cell addresses retained
  sha256: f091f61ce57ab7430b561e735c3402603d58cebb67d03d4c389c4cfc99801aba
scope: Complete cell-value transcription of the 2024 stock catalogue, including plate,
  round, tubes, pipes, profiles and aluminium sheets. Original text/units/alternatives
  are retained. Graphical shapes and dimension diagrams are not transcribed. The separately
  typed raw_material_sizes table is a numeric subset for direct lookup, not a claim
  that other forms are unavailable.

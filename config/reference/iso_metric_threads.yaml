# ISO metric screw threads: the standard nominal sizes with their coarse and fine pitches, and the tolerance
# classes tabulated per size. Used by MC-005 (standard thread size) and WST-216 (thread tolerance class).
#
# Sizes and pitches: ISO 261:1998 general plan, 1 to 80 mm (the Westermann tables list only M1.6-M36 coarse and
# M8x1-M36x3 fine; every one of those agrees with this list: pdf 45R, book 85 and pdf 46L, book 86). `coarse:
# null` = the size has fine pitches only (M15, M35, M50 ...). Above 80 mm no finding.
# Tolerance classes: IS 4218 (Part VI)-1967 via the Westermann table "ISO Metric Screw Threads" (pdf 46L, book
# 86), which tabulates 5H, 6H, 7H (nut) and 4h, 6g, 8g (bolt); a dash there means the class is not given for the
# size: 6H below M1.6, 7H below M3, 8g below M5.
source: {document: 'ISO 261:1998 ISO general purpose metric screw threads, general plan; Westermann Tables for the Metal Trade (Jutz-Scharkus)', section: 'ISO 261 Table 1; Westermann ISO Metric Screw Threads, IS: 4218 (Part III, VI)-1967 (pdf 45R-46L, book 85-86)'}


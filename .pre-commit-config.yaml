# data/ holds committed client data and model outputs (ADR 0007): never rewrite it.
exclude: ^data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=50000"]   # GitHub warns above 50 MB
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-env-files
        name: block .env files (API keys)
        entry: .env files hold API keys and must never be committed; share keys privately
        language: fail
        files: (^|/)\.env(\..*)?$
        exclude: \.env\.example$
